# wyoming-whistle stack (Compose v2; works as a Portainer stack).
# In Portainer, set HA_TOKEN under "Environment variables" of the stack.
name: wyoming-whistle

services:
  whistle:
    image: ghcr.io/arpena/whistle-wyoming:latest  # linux/amd64 + linux/arm64
    container_name: wyoming-whistle
    restart: unless-stopped
    # Host network: HA (also host network) is reachable at 127.0.0.1:8123
    network_mode: host
    environment:
      HA_URL: ${HA_URL:-http://127.0.0.1:8123}
      HA_TOKEN: ${HA_TOKEN:?set HA_TOKEN in the stack environment variables}
      WHISTLE_LANGUAGE: ${WHISTLE_LANGUAGE:-en}
      WHISTLE_MAX_KEYWORDS: ${WHISTLE_MAX_KEYWORDS:-200}
      WHISTLE_REFRESH: ${WHISTLE_REFRESH:-3600}
      WHISTLE_EXTRA_KEYWORDS: ${WHISTLE_EXTRA_KEYWORDS:-}  # e.g. "yerba, dulce de leche"
      WHISTLE_SAVE_AUDIO: ${WHISTLE_SAVE_AUDIO:-}  # e.g. /recordings: save each request's audio + transcript
      WHISTLE_SAVE_AUDIO_MAX: ${WHISTLE_SAVE_AUDIO_MAX:-500}
      CACTUS_TELEMETRY: "0"  # cactus-compute sends usage counts by default
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - whistle-cache:/root/.cache  # engine, model and Hugging Face cache
      # - ./recordings:/recordings  # with WHISTLE_SAVE_AUDIO=/recordings

volumes:
  whistle-cache:
    name: whistle-cache
